[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxnt"
version = "0.1.0"
description = "FluxNeurotransmitter: fully-automated AI circuit design pipeline (requirements -> BOM -> schematic -> PCB -> simulation gates -> firmware)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "FluxNeurotransmitter contributors" }]
dependencies = ["pyyaml>=6.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
flux = "fluxnt.cli:main"

[tool.setuptools.packages.find]
include = ["fluxnt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
